<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Reporte - Panel Administrativo</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="index.html" class="sidebar-brand">
                    <i class="fas fa-landmark"></i> MuniPanel
                </a>
            </div>

            <nav class="sidebar-menu">
                <a href="dashadmin.html"><i class="fas fa-home"></i> Inicio</a>
                <a href="users.html"><i class="fas fa-users"></i> Usuarios</a>
                <a href="reports.html" class="active"><i class="fas fa-file-alt"></i> Reportes</a>
                <a href="appointments.html"><i class="fas fa-calendar-check"></i> Citas</a>
                <a href="settings.html"><i class="fas fa-cog"></i> Configuración</a>
            </nav>

            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="user-avatar">AD</div>
                    <div class="user-info">
                        <div style="font-weight: 600;">Admin</div>
                        <div style="font-size: 0.8rem; opacity: 0.7;">admin@escazu.go.cr</div>
                    </div>
                </div>
                <a href="index.html" class="btn btn-secondary btn-block"
                    style="text-align: center; margin-top: 0.5rem;"><i class="fas fa-sign-out-alt"></i> Cerrar
                    Sesión</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="dashboard-header">
                <div>
                    <h1>Crear Nuevo Reporte</h1>
                    <p class="dashboard-date">Registra un nuevo incidente o reporte.</p>
                </div>
                <div>
                    <a href="reports.html" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Volver</a>
                </div>
            </div>

            <div class="recent-activity">
                <form id="reportForm">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem;">
                        <div>
                            <label for="tipo" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Tipo de
                                Reporte</label>
                            <select id="tipo" name="tipo"
                                style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px;">
                                <option value="infraestructura">Infraestructura</option>
                                <option value="seguridad">Seguridad</option>
                                <option value="limpieza">Limpieza y Ornato</option>
                                <option value="alumbrado">Alumbrado Público</option>
                                <option value="otro">Otro</option>
                            </select>
                        </div>
                        <div>
                            <label for="ubicacion"
                                style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Ubicación
                                Exacta</label>
                            <input type="text" id="ubicacion" name="ubicacion" required
                                placeholder="Ej: Frente a la escuela central"
                                style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px;">
                        </div>
                        <div style="grid-column: span 2;">
                            <label for="descripcion"
                                style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Descripción del
                                Incidente</label>
                            <textarea id="descripcion" name="descripcion" rows="4" required
                                placeholder="Describa detalladamente la situación..."
                                style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px; resize: vertical;"></textarea>
                        </div>
                        <div>
                            <label for="reportado_por"
                                style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Reportado Por
                                (Usuario)</label>
                            <input type="text" id="reportado_por" name="reportado_por"
                                placeholder="Nombre o ID del ciudadano"
                                style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px;">
                        </div>
                        <div>
                            <label for="prioridad"
                                style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Prioridad</label>
                            <select id="prioridad" name="prioridad"
                                style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px;">
                                <option value="baja">Baja</option>
                                <option value="media" selected>Media</option>
                                <option value="alta">Alta</option>
                                <option value="critica">Crítica</option>
                            </select>
                        </div>
                    </div>

                    <div style="border-top: 1px solid #eee; padding-top: 1.5rem; text-align: right;">
                        <a href="reports.html" class="btn btn-secondary" style="margin-right: 0.5rem;">Cancelar</a>
                        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Registrar
                            Reporte</button>
                    </div>
                </form>
                <script type="module" src="../js/app.js"></script>
            </div>
        </main>
    </div>

</body>

</html>
