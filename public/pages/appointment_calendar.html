<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario de Citas - Panel Administrativo</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            background: #e2e8f0;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            overflow: hidden;
            margin-top: 1rem;
        }

        .calendar-header-day {
            background: #f8f9fa;
            padding: 1rem;
            text-align: center;
            font-weight: 600;
            color: #4a5568;
        }

        .calendar-day {
            background: white;
            min-height: 120px;
            padding: 0.5rem;
            position: relative;
        }

        .calendar-day:hover {
            background: #fcfcfc;
        }

        .day-number {
            font-weight: 600;
            margin-bottom: 0.5rem;
            display: block;
            color: #718096;
        }

        .calendar-event {
            background: var(--primary-color);
            color: white;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-bottom: 0.25rem;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .calendar-event.urgent {
            background: #e74c3c;
        }

        .calendar-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .calendar-title {
            font-size: 1.5rem;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="index.html" class="sidebar-brand">
                    <i class="fas fa-landmark"></i> MuniPanel
                </a>
            </div>

            <nav class="sidebar-menu">
                <a href="dashadmin.html"><i class="fas fa-home"></i> Inicio</a>
                <a href="users.html"><i class="fas fa-users"></i> Usuarios</a>
                <a href="reports.html"><i class="fas fa-file-alt"></i> Reportes</a>
                <a href="appointments.html" class="active"><i class="fas fa-calendar-check"></i> Citas</a>
                <a href="settings.html"><i class="fas fa-cog"></i> Configuración</a>
            </nav>

            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="user-avatar">AD</div>
                    <div class="user-info">
                        <div style="font-weight: 600;">Admin</div>
                        <div style="font-size: 0.8rem; opacity: 0.7;">admin@escazu.go.cr</div>
                    </div>
                </div>
                <a href="index.html" class="btn btn-secondary btn-block"
                    style="text-align: center; margin-top: 0.5rem;"><i class="fas fa-sign-out-alt"></i> Cerrar
                    Sesión</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="dashboard-header">
                <div>
                    <h1>Calendario de Actividades</h1>
                    <p class="dashboard-date">Vista mensual de citas y eventos.</p>
                </div>
                <div>
                    <a href="appointment_form.html" class="btn btn-primary"><i class="fas fa-plus"></i> Agendar</a>
                    <a href="appointments.html" class="btn btn-secondary"><i class="fas fa-list"></i> Vista Lista</a>
                </div>
            </div>

            <div class="recent-activity">
                <div class="calendar-controls">
                    <button id="prevMonth" class="btn btn-secondary"><i class="fas fa-chevron-left"></i>
                        Anterior</button>
                    <div id="calendarTitle" class="calendar-title">Febrero 2026</div>
                    <button id="nextMonth" class="btn btn-secondary">Siguiente <i
                            class="fas fa-chevron-right"></i></button>
                </div>

                <div id="calendarGrid" class="calendar-grid">
                    <!-- El contenido se generará dinámicamente -->
                </div>
            </div>
        </main>
    </div>
    <script src="../js/appointmentcalendar.js"></script>
</body>

</html>
