<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Municipalidad de Escazú</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

    <!-- Navbar (Simplified for Auth) -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <i class="fas fa-landmark"></i> MuniEscazú
            </a>
            <div class="nav-links">
                <a href="index.html">Volver al Inicio</a>
            </div>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <i class="fas fa-user-circle fa-3x" style="color: var(--primary-color); margin-bottom: 1rem;"></i>
                <h2>Iniciar Sesión</h2>
                <p>Acceda a su cuenta para realizar trámites.</p>
            </div>

            
                <!-- Method GET to simulate login and go to dashboard for demo purposes since no JS/backend logic -->
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" class="form-control" placeholder="ejemplo@correo.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
           
            <script src="../js/app.js"></script>

            <div class="auth-footer">
                <p>¿No tiene una cuenta? <a href="register.html">Regístrese aquí</a></p>
                <p style="margin-top: 0.5rem;"><a href="#">¿Olvidó su contraseña?</a></p>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="container">
            <div class="copyright">
                <p>&copy; 2026 Municipalidad de Escazú. Todos los derechos reservados.</p>
            </div>
        </div>
    </footer>

</body>

</html>
