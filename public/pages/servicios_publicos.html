<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Servicios Públicos - Municipalidad de Escazú</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

    <div class="dashboard-container">
        <!-- Main Content -->
        <main class="main-content" style="margin-left: 0; width: 100%; max-width: 800px; margin: 2rem auto;">
            <div class="dashboard-header">
                <div>
                    <h1>Gestión de Servicios Públicos</h1>
                    <p class="dashboard-date">Reporte averías o solicite servicios básicos.</p>
                </div>
                <div>
                    <a href="index.html" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Volver al
                        Inicio</a>
                </div>
            </div>

            <div class="recent-activity">
                <form id="servicioForm">
                    <div style="display: grid; grid-template-columns: 1fr; gap: 1.5rem; margin-bottom: 1.5rem;">
                        <div>
                            <label for="servicio" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Tipo
                                de Servicio / Avería</label>
                            <select id="servicio" name="servicio" required
                                style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px;">
                                <option value="">-- Seleccione una opción --</option>
                                <option value="Recolección de Residuos">Recolección de Residuos</option>
                                <option value="Alumbrado Público">Alumbrado Público</option>
                                <option value="Mantenimiento de Vías">Mantenimiento de Vías</option>
                                <option value="Parques y Ornato">Parques y Ornato</option>
                                <option value="Aseo de Vías">Aseo de Vías</option>
                                <option value="Otro">Otro</option>
                            </select>
                        </div>
                        <div>
                            <label for="ubicacion"
                                style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Ubicación del
                                Incidente</label>
                            <input type="text" id="ubicacion" name="ubicacion" required
                                placeholder="Dirección exacta o puntos de referencia" minlength="10" maxlength="200"
                                style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px;">
                        </div>
                        <div>
                            <label for="detalle"
                                style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Detalle de la
                                Solicitud</label>
                            <textarea id="detalle" name="detalle" rows="4" required
                                placeholder="Describa el problema o solicitud de manera clara..." minlength="15"
                                maxlength="500"
                                style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px; resize: vertical;"></textarea>
                            <small style="color: #888;" id="detalle-counter">0 / 500 caracteres</small>
                        </div>
                    </div>

                    <div style="border-top: 1px solid #eee; padding-top: 1.5rem; text-align: right;">
                        <a href="index.html" class="btn btn-secondary" style="margin-right: 0.5rem;">Cancelar</a>
                        <button type="submit" class="btn btn-primary"><i class="fas fa-check-circle"></i> Enviar
                            Solicitud</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script type="module" src="../js/servicios_publicos.js"></script>
    <script>
        const detalle = document.getElementById('detalle');
        const counter = document.getElementById('detalle-counter');
        detalle.addEventListener('input', () => {
            counter.textContent = `${detalle.value.length} / 500 caracteres`;
        });
    </script>
</body>

</html>
