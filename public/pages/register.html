<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Municipalidad de Escazú</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <i class="fas fa-landmark"></i> MuniEscazú
            </a>
            <div class="nav-links">
                <a href="index.html">Volver al Inicio</a>
            </div>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <i class="fas fa-user-plus fa-3x" style="color: var(--primary-color); margin-bottom: 1rem;"></i>
                <h2>Crear Cuenta</h2>
                <p>Complete sus datos para registrarse en el sistema.</p>
            </div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="fullname">Nombre Completo</label>
                    <input type="text" id="fullname" class="form-control" placeholder="Juan Pérez" required
                        minlength="3" maxlength="80" pattern="[A-Za-záéíóúÁÉÍÓÚñÑ\s]+"
                        title="Solo letras y espacios, mínimo 3 caracteres">
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" class="form-control" placeholder="ejemplo@correo.com" required
                        maxlength="100">
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" class="form-control" placeholder="Mínimo 6 caracteres" required
                        minlength="6" maxlength="50" title="La contraseña debe tener al menos 6 caracteres">
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirmar Contraseña</label>
                    <input type="password" id="confirm-password" class="form-control" placeholder="Repite tu contraseña"
                        required minlength="6" maxlength="50">
                    <small id="password-match-msg" style="color: #e74c3c; display: none;">Las contraseñas no
                        coinciden.</small>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Registrarse</button>
            </form>
            <script type="module" src="../js/register.js"></script>
            <script>
                // Live password match check
                const pw = document.getElementById('password');
                const cpw = document.getElementById('confirm-password');
                const msg = document.getElementById('password-match-msg');
                cpw.addEventListener('input', () => {
                    msg.style.display = (cpw.value && cpw.value !== pw.value) ? 'block' : 'none';
                });
                document.getElementById('registerForm').addEventListener('submit', (e) => {
                    if (pw.value !== cpw.value) {
                        e.preventDefault();
                        msg.style.display = 'block';
                        cpw.focus();
                    }
                });
            </script>

            <div class="auth-footer">
                <p>¿Ya tiene una cuenta? <a href="login.html">Inicie Sesión aquí</a></p>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="container">
            <div class="copyright">
                <p>&copy; 2026 Municipalidad de Escazú. Todos los derechos reservados.</p>
            </div>
        </div>
    </footer>

</body>

</html>
