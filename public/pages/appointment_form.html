<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar Cita - Panel Administrativo</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="index.html" class="sidebar-brand">
                    <img src="../imgs/Gemini_Generated_Image_l1zutl1zutl1zutl-removebg-preview.png" alt="Muni Escazú"
                        style="height: 35px; border-radius: 50%;"> Municipalidad Escazú
                </a>
            </div>

            <nav class="sidebar-menu">
                <a href="dashadmin.html"><i class="fas fa-home"></i> Inicio</a>
                <a href="users.html"><i class="fas fa-users"></i> Usuarios</a>
                <a href="reports.html"><i class="fas fa-file-alt"></i> Reportes</a>
                <a href="appointments.html" class="active"><i class="fas fa-calendar-check"></i> Citas</a>
                <a href="settings.html"><i class="fas fa-cog"></i> Configuración</a>
            </nav>

            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="user-avatar">AD</div>
                    <div class="user-info">
                        <div style="font-weight: 600;">Admin</div>
                        <div style="font-size: 0.8rem; opacity: 0.7;">admin@escazu.go.cr</div>
                    </div>
                </div>
                <a href="index.html" class="btn btn-secondary btn-block"
                    style="text-align: center; margin-top: 0.5rem;"><i class="fas fa-sign-out-alt"></i> Cerrar
                    Sesión</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="dashboard-header">
                <div>
                    <h1>Agendar Nueva Cita</h1>
                    <p class="dashboard-date">Programa una cita para un ciudadano.</p>
                </div>
                <div>
                    <a href="appointments.html" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Volver</a>
                </div>
            </div>

            <div class="recent-activity">
                <form id="appointmentForm">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem;">
                        <div>
                            <label for="ciudadano"
                                style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Ciudadano</label>
                            <input type="text" id="ciudadano" name="ciudadano" required
                                placeholder="Nombre completo del ciudadano" minlength="3" maxlength="80"
                                title="Mínimo 3 caracteres"
                                style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px;">
                        </div>
                        <div>
                            <label for="tramite" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Tipo
                                de Trámite</label>
                            <select id="tramite" name="tramite" required
                                style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px;">
                                <option value="">-- Seleccione un trámite --</option>
                                <option value="Permiso de Construcción">Permiso de Construcción</option>
                                <option value="Pago de Impuestos">Pago de Impuestos</option>
                                <option value="Solicitud de Patente">Solicitud de Patente</option>
                                <option value="Consulta Catastral">Consulta Catastral</option>
                                <option value="Otro">Otro</option>
                            </select>
                        </div>
                        <div>
                            <label for="departamento"
                                style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Departamento</label>
                            <select id="departamento" name="departamento" required
                                style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px;">
                                <option value="">-- Seleccione un departamento --</option>
                                <option value="Urbanismo">Urbanismo</option>
                                <option value="Cobros">Cobros</option>
                                <option value="Catastro">Catastro</option>
                                <option value="Desarrollo Social">Desarrollo Social</option>
                                <option value="Patentes">Patentes</option>
                                <option value="Otro">Otro</option>
                            </select>
                        </div>
                        <div>
                            <label for="fecha"
                                style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Fecha</label>
                            <input type="date" id="fecha" name="fecha" required
                                style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px;">
                        </div>
                        <div>
                            <label for="hora"
                                style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Hora</label>
                            <input type="time" id="hora" name="hora" required min="07:00" max="17:00"
                                title="Horario de atención: 7:00 AM a 5:00 PM"
                                style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px;">
                        </div>
                        <div style="grid-column: span 2;">
                            <label for="notas" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Notas
                                Adicionales</label>
                            <textarea id="notas" name="notas" rows="3" placeholder="Detalles extra sobre la cita..."
                                maxlength="300"
                                style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px; resize: vertical;"></textarea>
                            <small style="color: #888;" id="notas-counter">0 / 300 caracteres</small>
                        </div>
                    </div>

                    <div style="border-top: 1px solid #eee; padding-top: 1.5rem; text-align: right;">
                        <a href="appointments.html" class="btn btn-secondary" style="margin-right: 0.5rem;">Cancelar</a>
                        <button type="submit" class="btn btn-primary"><i class="fas fa-calendar-check"></i> Agendar
                            Cita</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script type="module" src="../js/appointment_form.js"></script>
    <script>
        // Set minimum date to today
        const fechaInput = document.getElementById('fecha');
        fechaInput.min = new Date().toISOString().split('T')[0];

        // Character counter for notes
        const notas = document.getElementById('notas');
        const notasCounter = document.getElementById('notas-counter');
        notas.addEventListener('input', () => {
            notasCounter.textContent = `${notas.value.length} / 300 caracteres`;
        });
    </script>
</body>

</html>
